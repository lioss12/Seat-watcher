# seat watcher v3.1: cron + self-chaining relay
name: seat-check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram test message instead of checking seats?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  repository_dispatch:
    types: [watch-again]

permissions:
  contents: write

concurrency:
  group: seat-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check seats (or send Telegram test)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            python watcher_actions.py --test-telegram
          else
            python watcher_actions.py --once
          fi

      - name: Save state back to repo
        if: inputs.test_telegram != 'true'
        run: |
          git config user.name "seat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update seat state [skip ci]"
          git pull --rebase origin ${GITHUB_REF##*/} || true
          git push

      - name: Chain the next check in ~4 minutes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 240
          gh api repos/${{ github.repository }}/dispatches -f event_type=watch-again
